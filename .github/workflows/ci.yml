name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch. Pushing three times in quick
# succession should not tie up runners building two obsolete images.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: fails loudly if the lockfile and
      # package.json have drifted, instead of silently resolving something new.
      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  image:
    name: Build and push image
    # Never publish an image that has not passed the suite.
    needs: test
    # Pull requests from forks cannot access GHCR credentials, and publishing
    # an image for unreviewed code would be a poor idea regardless.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        # Needed to build the arm64 image on an amd64 runner. Cheap here
        # because every production dependency is pure JavaScript - there is
        # nothing to compile under emulation.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Immutable, and the tag to pin in compose.
            type=sha,format=short,prefix=
            # Moving convenience tag for the initial test deployment.
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Woodhouse
            org.opencontainers.image.description=A personal butler for your GitHub repositories

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persist the layer cache in GitHub Actions cache so unchanged
          # dependency layers are not rebuilt on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestations add `unknown/unknown` entries to the
          # manifest list, which clutter the GHCR package page and confuse
          # some tools. Worth revisiting alongside signing later.
          provenance: false

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
