name: Release

on:
  push:
    branches: [main]

# release-please writes commits, tags and releases, so it cannot live in
# ci.yml: that workflow also runs on pull requests and must stay read-only.
jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest

    # Scoped to the job, not the workflow, so the image re-tag job below can
    # hold its own narrower grant instead of inheriting this
    # one. Opening and updating the release pull request needs
    # `pull-requests: write`; labeling it `autorelease: pending` needs
    # `issues: write`, and that label is load-bearing — release-please only
    # recognizes its own release PRs by it, so a PR that failed to be labeled
    # would merge without ever being tagged. `contents: write` writes the
    # release commit, tag and GitHub release. This set is exactly what the
    # action's README documents under "Workflow Permissions".
    #
    # These caps bind the workflow's default `GITHUB_TOKEN`. The actual writes
    # are performed by a GitHub App installation token minted in the step
    # below (app token-created pull requests do trigger workflows,
    # `GITHUB_TOKEN` ones do not — that difference is the whole reason for
    # the App). A `permissions` block cannot reach the app token, so the App's
    # repository permissions must mirror this set: `contents`,
    # `pull-requests` and `issues` read/write plus the bundled read-only
    # Metadata, and nothing more.
    permissions:
      contents: write
      issues: write
      pull-requests: write

    # Surfaced so the re-tag job below can chain on them. Without the `id` on
    # the action step and this mapping, `needs.release-please.outputs.release_created`
    # is the empty string, and an empty string in a job-level `if` silently
    # skips the job: the release would happen, the images never get their
    # version tags, and nothing would error.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
      major: ${{ steps.release.outputs.major }}

    steps:
      # Exchanges RELEASE_APP_ID (a repository **variable**, not a secret —
      # an App ID is public) + RELEASE_APP_PRIVATE_KEY (a **secret**) for a
      # 1-hour installation token scoped to the one repository. The whole
      # exchange happens here, in this job: the minted credential never
      # leaves it.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: recursive-cloud
          repositories: woodhouse

      # With release-please-config.json and .release-please-manifest.json at
      # the repo root, the action's defaults already resolve to exactly those
      # files - only the credential is overridden. Without `token` the action
      # would act as `GITHUB_TOKEN`, whose pull requests trigger no
      # workflows. The `id` is what lets the job's `outputs` block read this
      # step's results.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

  retag-image:
    name: Re-tag image with release version
    # Chained by `needs`, not a `release: published` trigger (one that an
    # app-token release would fire): the chain pins the re-tag into the same
    # run, so the release outputs are already in hand. Action outputs are always
    # strings, so this compares against the literal 'true' — 'false' is truthy
    # in a GitHub expression, and a truthiness check would run the job on every
    # push.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    # Only the registry is written (imagetools create copies a manifest list),
    # so `packages: write` is the whole grant. The release SHA and version tag
    # arrive via job outputs, so there is no checkout and no `contents:` read.
    permissions:
      packages: write

    steps:
      # Nothing is read from the repository: the release commit's FULL 40-char
      # SHA and the version tag both come from the release-please job's
      # outputs. ci.yml tags the push build with the bare 7-char short SHA
      # (metadata-action `type=sha,format=short,prefix=`), so the source ref is
      # the first 7 characters of that SHA.
      - name: Resolve image tags
        id: tags
        env:
          FULL_SHA: ${{ needs.release-please.outputs.sha }}
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          MAJOR: ${{ needs.release-please.outputs.major }}
        run: |
          echo "source=ghcr.io/${{ github.repository }}:${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=v${MAJOR}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ci.yml's push build for the same merge may still be running: release-
      # please cuts the release in seconds while the image job queues behind
      # lint and test and then runs a QEMU multi-arch build. buildx creates the
      # tag only when the final manifest list lands, so the tag appearing means
      # the push completed — never a partial push. Poll for it, bounded: 40
      # attempts 30 seconds apart is 20 minutes, which covers a cold build and
      # queue delay; exceeding it means something is actually wrong, most
      # plausibly ci.yml's `cancel-in-progress` killing the build on a further
      # push to main. The inspect sits in the `if` on purpose: run steps
      # default to `bash -e`, so a bare inspect would abort the step on the
      # first not-yet-existing tag and silently reintroduce the race.
      - name: Wait for the image build
        env:
          SOURCE: ${{ steps.tags.outputs.source }}
        run: |
          for attempt in $(seq 1 40); do
            echo "attempt ${attempt}/40"
            if docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::The image ${SOURCE} did not appear within 20 minutes." \
            "ci.yml's image build was likely cancelled by a further push to main, or it failed;" \
            "see the release runbook recovery in README.md: re-run CI's image job, then this job."
          exit 1

      # Two invocations, one `-t` each — that is the documented syntax. Each
      # carbon-copies the multi-arch manifest list from the short-SHA image, so
      # both version tags land on the identical digest without rebuilding
      # anything. The wait above has confirmed the source ref exists, so these
      # copy a complete manifest list.
      - name: Tag the release version
        run: docker buildx imagetools create -t "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}" "${{ steps.tags.outputs.source }}"

      - name: Tag the floating major version
        run: docker buildx imagetools create -t "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.major }}" "${{ steps.tags.outputs.source }}"

      - name: Summarise
        run: |
          {
            echo "### Image re-tagged"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.version }}"
            echo "ghcr.io/${{ github.repository }}:${{ steps.tags.outputs.major }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
