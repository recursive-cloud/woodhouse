apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: woodhouse

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  # secret.example.yaml is deliberately NOT listed. Create the real secret
  # out of band (see the comments in that file).

images:
  - name: ghcr.io/REPLACE_ME/woodhouse
    # Pin the release version rather than `latest`. release-please rewrites the
    # annotated line below on every release, so the pin follows releases; until
    # the 1.0.0 release merges the tag does not exist yet, and a pull fails
    # loudly rather than silently. It replaces the first version-looking string
    # on the line, so keep that annotated line free of any other version string.
    newTag: v1.0.0 # x-release-please-version

# Rolls the deployment automatically whenever the allowlist or log level
# changes, instead of leaving a stale pod running the old configuration.
configMapGenerator: []
generatorOptions:
  disableNameSuffixHash: false
