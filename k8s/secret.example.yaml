# -----------------------------------------------------------------------------
# TEMPLATE ONLY — do not commit a filled-in copy of this file.
#
# Create the real secret imperatively instead, which keeps the private key out
# of shell history and out of git:
#
#   kubectl create secret generic woodhouse \
#     --namespace woodhouse \
#     --from-literal=APP_ID=123456 \
#     --from-literal=WEBHOOK_SECRET="$(openssl rand -hex 32)" \
#     --from-file=PRIVATE_KEY=./woodhouse.private-key.pem
#
# Using --from-file for the key avoids the multi-line YAML problem entirely.
# If you would rather manage this declaratively, use SealedSecrets or the
# External Secrets Operator rather than a plain Secret in git.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: woodhouse
  namespace: woodhouse
type: Opaque
stringData:
  # Numeric App ID from the GitHub App settings page.
  APP_ID: "REPLACE_ME"

  # Must match the secret configured on the App's webhook. Generate with:
  #   openssl rand -hex 32
  WEBHOOK_SECRET: "REPLACE_ME"

  # The full .pem contents. The app also accepts a single-line base64 encoding
  # of the same key, which is usually less painful here:
  #   base64 -w0 < woodhouse.private-key.pem
  PRIVATE_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    REPLACE_ME
    -----END RSA PRIVATE KEY-----
