apiVersion: v1
kind: ConfigMap
metadata:
  name: woodhouse
  namespace: woodhouse
data:
  # Default installation allowlist, applied to any App that does not define its
  # own. Events from any other owner are dropped before a token is even minted.
  # There is no wildcard, and an App that ends up with no allowlist at all
  # stops the pod from starting rather than allowing everything.
  ALLOWED_INSTALLATION_TARGETS: '["my-github-username","my-homelab-org"]'

  # Repository holding the owner-wide baseline config. Not `.github`, which
  # must be public for several built-in GitHub features to work.
  BASELINE_REPO: ".github-private"

  LOG_LEVEL: "info"
  PORT: "3000"

  # Set to "true" for the first run against real repositories: every decision
  # is evaluated and logged, but nothing is written back to GitHub.
  DRY_RUN: "false"
